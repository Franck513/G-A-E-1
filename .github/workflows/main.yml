name: Build G-A-E APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque sur le serveur
        run: |
          echo "==> Espace disque avant nettoyage :"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "==> Espace disque après nettoyage :"
          df -h /

      - name: Configurer Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configuration de Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: Dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libjpeg-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libwebp-dev \
            libgtk-3-dev \
            ninja-build

      - name: Acceptation des licences Android SDK
        run: |
          flutter config --no-analytics
          yes | flutter doctor --android-licenses || true

      - name: Préparation de Flet, ReportLab & Stub PIL
        run: |
          python -m pip install --upgrade "pip<24" "setuptools<70" wheel

          # Mettre à jour Flet vers la dernière version compatible Flutter 3.24+
          pip install --upgrade flet
          pip install -e . || pip install .

          # 1. Téléchargement direct de ReportLab en Python pur dans le projet
          pip install reportlab --target . --no-deps

          # 2. Simulation du module PIL pour éviter l'erreur sur le téléphone
          mkdir -p PIL
          cat << 'EOF' > PIL/__init__.py
          from . import Image
          EOF
          
          cat << 'EOF' > PIL/Image.py
          class Image:
              @staticmethod
              def open(fp, mode='r'):
                  return Image()
              def resize(self, size, *args, **kwargs):
                  return self
              def convert(self, *args, **kwargs):
                  return self
          EOF

      - name: Générer l'APK Android (Mode non-interactif)
        env:
          CI: "true"
          FLUTTER_SUPPRESS_ANALYTICS: "true"
          PUB_DISABLE_ANALYTICS: "true"
          PIP_VERBOSE: "1"
        run: |
          yes | flet build apk --verbose

      - name: Sauvegarder l'APK en artifact GitHub (Non-bloquant)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GAEApp-Android
          path: build/apk/*.apk

      - name: Obtenir un lien de téléchargement direct
        if: always()
        run: |
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "=========================================================="
            echo " FICHIER APK DÉTECTÉ : $APK_FILE"
            echo "=========================================================="
            echo ""
            echo "--> LIEN 1 (BashUpload - Téléchargement immédiat) :"
            curl -T "$APK_FILE" https://bashupload.com/ || true
            echo ""
            echo ""
            echo "--> LIEN 2 (Litterbox - Valide 24h) :"
            curl -F "reqtype=fileupload" -F "time=24h" -F "fileToUpload=@$APK_FILE" https://litterbox.catbox.moe/resources/internals/api.php || true
            echo ""
            echo "=========================================================="
          else
            echo "Aucun fichier APK n'a été trouvé."
          fi
